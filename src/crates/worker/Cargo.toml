[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "bamix-worker"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
